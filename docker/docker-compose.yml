version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: brand_engineer_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brandengineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandengineer_dev}
      POSTGRES_DB: ${POSTGRES_DB:-brand_engineer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brandengineer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: brand_engineer_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brandengineer}:${POSTGRES_PASSWORD:-brandengineer_dev}@db:5432/${POSTGRES_DB:-brand_engineer}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev_secret_key_change_in_production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
